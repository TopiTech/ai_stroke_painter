name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai_stroke_painter
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ai_stroke_painter/pyproject.toml
      - name: Install quality tools
        run: python -m pip install "ruff>=0.1.0" "mypy>=1.0.0" "pyrefly>=1.0.0"
      - name: Run checks
        working-directory: ai_stroke_painter
        run: python check.py
      - name: Build plugin archive
        working-directory: ai_stroke_painter
        run: python build_plugin.py
