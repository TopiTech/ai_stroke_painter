name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux:
    name: Test (Ubuntu / Qt6)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6 & build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools ninja-build

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAI_STROKE_STANDALONE_TESTS=ON

      - name: Build AI Stroke Tests
        run: cmake --build build -j$(nproc)

      - name: Run AI Stroke Tests
        run: ctest --test-dir build --output-on-failure

  test-windows:
    name: Test (Windows MinGW / Qt6)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 & MinGW Qt6
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAI_STROKE_STANDALONE_TESTS=ON

      - name: Build AI Stroke Tests
        run: cmake --build build

      - name: Run AI Stroke Tests
        run: ctest --test-dir build --output-on-failure
