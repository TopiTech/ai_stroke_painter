[project]
name = "ai_stroke_painter"
version = "1.1.0"
description = "Editable AI-assisted stroke painting plugin for Krita"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "pyrefly>=1.0.0",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
]

[tool.pyrefly.errors]
no-any-return = "error"
redundant-cast = "warn"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line-too-long (handled by formatter / intentional)
    "SIM108", # ternary operator suggestion (readability preference)
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "krita",
    "PyQt5.*",
    "PyQt6.*",
]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pyrefly]
python-version = "3.10.0"
preset = "legacy"
ignore-missing-imports = [
    "krita",
    "pyqt5.*",
    "pyqt6.*",
]
